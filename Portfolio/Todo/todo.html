<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      padding: 48px 16px 80px;
    }

    .container { max-width: 460px; margin: 0 auto; }

    .date-label {
      font-size: 12px;
      color: #8e8e93;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -.6px;
      margin-bottom: 24px;
    }

    /* progress bar card */
    .progress-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px 18px;
      border: 1px solid rgba(0,0,0,.06);
      margin-bottom: 22px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label { font-size: 14px; font-weight: 500; }
    .progress-count { font-size: 13px; color: #8e8e93; }

    .progress-track {
      background: #f2f2f7;
      border-radius: 50px;
      height: 7px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 50px;
      background: #007aff;
      transition: width .4s ease;
    }

    /* section headings */
    .section-title {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #8e8e93;
      margin: 0 0 10px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 28px;
    }

    .task-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(0,0,0,.06);
      cursor: pointer;
      transition: transform .12s;
      user-select: none;
    }

    .task-card:active { transform: scale(.98); }
    .task-card.done { background: #f7f7fa; }

    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #d1d1d6;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s, border-color .18s;
    }

    .task-card.done .check-circle {
      background: #34c759;
      border-color: #34c759;
    }

    /* the little checkmark shape */
    .checkmark {
      display: none;
      width: 11px;
      height: 7px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
    }

    .task-card.done .checkmark { display: block; }

    .task-name {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      color: #1c1c1e;
    }

    .task-card.done .task-name {
      color: #8e8e93;
      text-decoration: line-through;
      text-decoration-color: #c7c7cc;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #c7c7cc;
      font-size: 20px;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
      transition: color .15s;
    }

    .delete-btn:hover { color: #ff3b30; }

    .add-row { display: flex; gap: 8px; }

    .add-input {
      flex: 1;
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 50px;
      padding: 12px 17px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #1c1c1e;
      outline: none;
    }

    .add-input::placeholder { color: #c7c7cc; }

    .add-input:focus {
      border-color: rgba(0,122,255,.4);
      box-shadow: 0 0 0 3px rgba(0,122,255,.1);
    }

    .add-btn {
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 12px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }

    .add-btn:hover { opacity: .85; }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: #c7c7cc;
      font-size: 14px;
    }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8e8e93;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 0;
      margin-top: 12px;
      transition: color .15s;
    }

    .clear-btn:hover { color: #ff3b30; }
  </style>
</head>
<body>
<div class="container">

  <div class="date-label" id="date-label"></div>
  <h1>To-Do</h1>

  <div class="progress-card">
    <div class="progress-header">
      <span class="progress-label">Progress</span>
      <span class="progress-count" id="progress-count">0 / 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="section-title">Tasks</div>
  <div class="task-list" id="task-list"></div>

  <div class="section-title">Add a task</div>
  <div class="add-row">
    <input class="add-input" id="new-task-input" type="text" placeholder="What needs to be done?" maxlength="60"/>
    <button class="add-btn" onclick="addTask()">Add</button>
  </div>
  <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>

</div>

<script>
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // show today's date at the top
  const today = new Date();
  document.getElementById('date-label').textContent =
    `${DAYS[today.getDay()]}, ${MONTHS[today.getMonth()]} ${today.getDate()}`;

  // --- storage helpers ---

  function loadTasks() {
    return JSON.parse(localStorage.getItem('tasks') || '[]');
  }

  function saveTasks(tasks) {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  // --- rendering ---

  function render() {
    const tasks = loadTasks();
    const completedCount = tasks.filter(t => t.done).length;
    const totalCount = tasks.length;

    // update progress bar
    document.getElementById('progress-count').textContent = `${completedCount} / ${totalCount}`;
    const pct = totalCount === 0 ? 0 : Math.round(completedCount / totalCount * 100);
    document.getElementById('progress-fill').style.width = pct + '%';

    const list = document.getElementById('task-list');

    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty-state">Nothing here yet - add a task </div>';
      return;
    }

    list.innerHTML = '';

    tasks.forEach(task => {
      const card = document.createElement('div');
      card.className = 'task-card' + (task.done ? ' done' : '');
      card.innerHTML = `
        <div class="check-circle"><div class="checkmark"></div></div>
        <span class="task-name">${task.text}</span>
        <button class="delete-btn" title="Remove">×</button>
      `;

      // delete button shouldn't also toggle the task
      card.querySelector('.delete-btn').addEventListener('click', e => {
        e.stopPropagation();
        deleteTask(task.id);
      });

      card.addEventListener('click', () => toggleTask(task.id));
      list.appendChild(card);
    });
  }

  // --- actions ---

  function addTask() {
    const input = document.getElementById('new-task-input');
    const text = input.value.trim();
    if (!text) return;

    const tasks = loadTasks();
    tasks.push({ id: Date.now().toString(), text, done: false });
    saveTasks(tasks);

    input.value = '';
    render();
  }

  function toggleTask(id) {
    const tasks = loadTasks();
    const task = tasks.find(t => t.id === id);
    if (task) task.done = !task.done;
    saveTasks(tasks);
    render();
  }

  function deleteTask(id) {
    saveTasks(loadTasks().filter(t => t.id !== id));
    render();
  }

  function clearCompleted() {
    saveTasks(loadTasks().filter(t => !t.done));
    render();
  }

  // allow pressing Enter to add a task
  document.getElementById('new-task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
